name: Development

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shop_branch:
        description: 'Branch of oxideshop-ce to use'
        required: false

jobs:
  run_tests:
    env:
      SHOP_BRANCH: ${{ inputs.shop_branch || 'b-8.0.x' }}
    strategy:
      matrix:
        php: [ '8.4', '8.5' ]
        mysql: [ '8.0', '8.4' ]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Clone testing environment
        run: git clone --depth 1 https://github.com/OXID-eSales/docker-eshop-sdk.git --branch master --single-branch .

      - name: Clone the shop
        run: git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch ${{ env.SHOP_BRANCH }} --single-branch source

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          perl -pi\
              -e "s#PHP_VERSION=.*#PHP_VERSION='${{ matrix.php }}'#g;"\
              -e "s#MYSQL_VERSION=.*#MYSQL_VERSION='${{ matrix.mysql }}'#g;"\
              .env
          perl -pi\
              -e 's#/var/www/#/var/www/source/#g;'\
              containers/httpd/project.conf

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Install shop and component
        run: |
          docker compose exec -T php composer config preferred-install.oxid-esales/* source
          docker compose exec -T php composer require oxid-esales/oxideshop-doctrine-migration-wrapper:dev-${{ github.ref_name }} --prefer-source --no-interaction
          cd source && sed -i 's|"OxidEsales\\\\EshopCommunity\\\\Tests\\\\|"OxidEsales\\\\DoctrineMigrationWrapper\\\\Tests\\\\": "vendor/oxid-esales/oxideshop-doctrine-migration-wrapper/tests",\n        "OxidEsales\\\\EshopCommunity\\\\Tests\\\\|' composer.json
          docker compose exec -T php composer dump-autoload

      - name: Reset shop
        run: docker compose exec -T php php bin/oe-console oe:database:reset --force

      - name: Run tests
        run: |
          docker compose exec -T php php vendor/bin/phpunit vendor/oxid-esales/oxideshop-doctrine-migration-wrapper/tests --bootstrap=/var/www/source/bootstrap.php | tee PHP${{ matrix.php }}_MYSQL${{ matrix.mysql }}_phpunit_log.txt 2>&1 || true
          if grep -q -Ei 'fail|\\.\\=\\=|Warning|Notice|Deprecated|Fatal|Error' PHP${{ matrix.php }}_MYSQL${{ matrix.mysql }}_phpunit_log.txt; then exit 1; fi

      - name: Upload PHPUnit Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-logs-PHP${{ matrix.php }}-MYSQL${{ matrix.mysql }}
          path: PHP${{ matrix.php }}_MYSQL${{ matrix.mysql }}_phpunit_log.txt
          if-no-files-found: error
          retention-days: 7